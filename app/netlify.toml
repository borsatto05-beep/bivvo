[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Aliases publicos/SEO — mantem links antigos e amigaveis funcionando
# 11.16 — uma URL só para "quanto posso gastar": a canônica é /quanto-posso-gastar-hoje/
[[redirects]]
  from = "/quanto-posso-gastar"
  to = "/quanto-posso-gastar-hoje/"
  status = 301
  force = true

[[redirects]]
  from = "/quanto-posso-gastar/*"
  to = "/quanto-posso-gastar-hoje/"
  status = 301
  force = true

